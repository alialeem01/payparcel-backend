{% extends "unfold/layouts/base.html" %}
{% block content %}
<div class="p-4">
    <h1 class="text-lg font-semibold mb-4">Login Credentials — {{ customer.customer_name }}</h1>
    <p class="text-sm text-base-500 mb-6">Current login username/email: <strong>{{ current_username }}</strong></p>

    <form method="post">
        {% csrf_token %}

        <label class="block font-medium mb-2">New Username / Email</label>
        <input type="text" name="username" value="{{ current_username }}" class="border border-base-200 rounded-default px-3 py-2 mb-4 w-full max-w-sm">

        <label class="block font-medium mb-2">New Password (leave blank to keep unchanged)</label>
        <input type="password" name="password" autocomplete="new-password" class="border border-base-200 rounded-default px-3 py-2 mb-6 w-full max-w-sm bg-white dark:bg-base-900 text-important">

        <div class="submit-row sticky bottom-0 bg-white dark:bg-base-900 border-t border-base-200 dark:border-base-800 flex gap-3 justify-end px-4 py-3 -mx-4 mt-6">
            <button type="submit" class="font-medium inline-flex items-center gap-1 rounded-default justify-center px-3 py-2 border border-base-200 bg-primary-600 text-white hover:bg-primary-600/80">
                Save Credentials
            </button>
        </div>
    </form>
</div>
{% endblock %}
