<!DOCTYPE html>
<html>
<head>
    <title>Track Parcel {{ parcel.cn }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 0 0 30px; color: #1e293b; }
        .header { background: #1d4ed8; color: #fff; padding: 20px; text-align: center; }
        .header .brand { font-size: 20px; font-weight: 800; }
        .content { padding: 20px; }
        .status { font-size: 22px; font-weight: 800; color: #1d4ed8; margin: 10px 0; }
        .narration { color: #555; margin-bottom: 16px; }
        .row { display: flex; justify-content: space-between; border-bottom: 1px solid #e2e8f0; padding: 8px 0; }
        .row .label { color: #64748b; font-size: 12px; }
        .row .value { font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">PayParcel</div>
    </div>
    <div class="content">
        <h2>Tracking: {{ parcel.cn }}</h2>
        <div class="status">{{ parcel.status }}</div>
        {% if narration %}<p class="narration">{{ narration }}</p>{% endif %}

        <div class="row"><span class="label">City</span><span class="value">{{ parcel.city|default:"-" }}</span></div>
        <div class="row"><span class="label">Delivery Address</span><span class="value">{{ parcel.address|default:"-" }}</span></div>
    
            
    </div>
</body>
</html>
