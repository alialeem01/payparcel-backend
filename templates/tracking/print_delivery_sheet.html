<!DOCTYPE html>
<html>
<head>
    <title>Delivery Sheet {{ ds.ds_number }}</title>
    <style>
        @page { size: A4; margin: 12mm; }
        body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; color: #1e293b; }
        .header { display: flex; justify-content: space-between; border-bottom: 3px solid #1d4ed8; padding-bottom: 10px; margin-bottom: 14px; }
        .brand { font-size: 22px; font-weight: 800; color: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #1d4ed8; color: #fff; padding: 7px 8px; text-align: left; font-size: 10px; text-transform: uppercase; }
        td { border-bottom: 1px solid #e2e8f0; padding: 7px 8px; }
        .qr-box { text-align: center; margin: 14px 0; }
        .qr-box img { width: 100px; height: 100px; }
    </style>
</head>
<body onload="window.print()">
    <div class="header">
        <div>
            <div class="brand">PayParcel</div>
            <div>Delivery Sheet</div>
        </div>
        <div>
            <div><strong>{{ ds.ds_number }}</strong></div>
            <div>{{ ds.tracking_number }}</div>
        </div>
    </div>
    <div class="qr-box">
        {% if ds.qr_code %}<img src="{{ ds.qr_code.url }}">{% endif %}
    </div>
    <table>
        <thead><tr><th>Parcel #</th><th>Qty</th><th>Weight</th><th>COD</th></tr></thead>
        <tbody>
            {% for p in parcels %}
            <tr><td>{{ p.cn }}</td><td>{{ p.number_of_pieces }}</td><td>{{ p.parcel_weight }}</td><td>{{ p.cod }}</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
